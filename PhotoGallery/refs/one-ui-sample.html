<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery — executable NUI preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f8;font-family:Arial,sans-serif;color:#202023;overflow:hidden}button,input{font:inherit}button{border:0;background:#eeeef0;color:inherit;border-radius:18px;font-size:28px;cursor:pointer}button:focus-visible,input:focus-visible{outline:4px solid #236bd6;outline-offset:3px}button:focus-visible{box-shadow:inset 0 0 0 3px white}#app{position:absolute;width:1920px;height:1080px;transform-origin:0 0;background:#f7f7f8}.title{position:absolute;left:64px;top:43px;font-size:42px;font-weight:700}.tool{position:absolute;top:50px;height:64px}.heading{position:absolute;left:64px;top:155px;font-size:60px;font-weight:700}.count{position:absolute;left:64px;top:227px;color:#727276;font-size:24px}.grid{position:absolute;left:64px;top:278px;width:1792px;display:grid;grid-template-columns:repeat(4,433px);gap:26px 20px}.photo{display:flex;flex-direction:column;justify-content:flex-start;width:433px;height:284px;background:transparent;text-align:left;padding:0;border-radius:12px}.photo img{width:433px;height:230px;object-fit:fill;border-radius:12px;display:block}.photo span{display:block;font-size:25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:42px;line-height:42px;padding-top:0;margin-top:6px}.tabs{position:absolute;left:650px;top:971px;display:flex;gap:15px}.tabs button{background:transparent;font-size:30px;border-radius:0;width:150px;height:62px}.tabs .selected{font-weight:400;border-bottom:4px solid #202023}.pager{position:absolute;right:64px;top:909px;display:flex;gap:16px;align-items:center;font-size:24px}.pager button{height:54px;width:120px}.empty{position:absolute;left:320px;top:432px;width:1280px;text-align:center}.empty h2{font-size:44px;font-weight:500}.empty p{font-size:28px;color:#727276}.viewer{position:absolute;inset:0;background:#111;color:white}.viewer>img{position:absolute;left:140px;top:150px;width:1640px;height:690px;object-fit:contain}.viewer .name{position:absolute;left:234px;top:60px;font-size:32px}.viewer .actions{position:absolute;left:368px;top:889px;display:flex;gap:16px}.viewer button{height:64px;min-width:180px;background:#303033;color:white}.viewer .back{position:absolute;left:64px;top:48px;min-width:130px}.shade{position:absolute;inset:0;background:#0008}.dialog{position:absolute;left:520px;top:240px;width:880px;height:570px;background:white;border-radius:28px;padding:44px;color:#202023}.dialog h2{margin:0 0 28px;font-size:44px}.dialog p{font-size:28px;line-height:1.5;white-space:pre-wrap}.dialog input{width:100%;height:70px;font-size:28px;border:1px solid #aaa;border-radius:12px;padding:12px}.dialog .actions{position:absolute;right:44px;bottom:40px;display:flex;gap:20px}.dialog button{height:64px;min-width:180px}.danger{color:#ba3030!important}.error{font-size:25px;color:#ba3030}.search{position:absolute;left:64px;top:160px;width:1300px;height:66px;font-size:30px;border:1px solid #aaa;border-radius:14px;padding:14px}
</style></head><body><main id="app" aria-label="Gallery"></main><script>
const app=document.querySelector('#app'),names=['Lake','Coast','Garden','Evening','Hills','River','Valley','Sunrise'];
let photos=names.map((title,i)=>({id:'photo-'+i,title,path:'../tests/fixtures/'+title+'.png',album:i<4?'Camera':'Travel',favorite:i===2,owned:true}));
let tab='Pictures',album=null,query='',search=false,page=0,current=null,dialog=null,slide=null,error='',load='ready',returnFocus=null;
function el(tag,cls,parent,text){const v=document.createElement(tag);v.className=cls||'';if(text!==undefined)v.textContent=text;parent.append(v);return v}
function btn(parent,text,action,cls=''){const b=el('button',cls,parent,text);b.onclick=()=>{returnFocus=text;action()};return b}
function scale(){const s=Math.min(innerWidth/1920,innerHeight/1080);app.style.transform=`scale(${s})`;app.style.left=(innerWidth-1920*s)/2+'px';app.style.top=(innerHeight-1080*s)/2+'px'}
function open(p){current=p;render()}
function filtered(){return photos.filter(p=>(tab!=='Favorites'||p.favorite)&&(!album||p.album===album)&&p.title.toLowerCase().includes(query.toLowerCase()))}
function stop(){clearInterval(slide);slide=null}
function toggleSlide(){if(slide)stop();else slide=setInterval(()=>advance(1),3000);render()}
function advance(n){if(!photos.length)return;current=photos[(photos.findIndex(p=>p.id===current?.id)+n+photos.length)%photos.length];render()}
function close(){if(dialog){dialog=null;error='';render();focusText(returnFocus);return}if(current){stop();current=null;render();return}if(search){search=false;query='';render();return}if(album){album=null;render()}}
function focusText(text){[...app.querySelectorAll('button')].find(x=>x.textContent===text)?.focus()}
function render(){app.replaceChildren();let main=el('section','',app);main.inert=!!dialog;
 if(current){const v=el('section','viewer',main);btn(v,'Back',close,'back');el('div','name',v,current.title);const im=el('img','',v);im.src=current.path;im.alt=current.title;im.onerror=()=>{im.alt='Photo could not be loaded';};const a=el('div','actions',v);btn(a,'Previous',()=>advance(-1));btn(a,'Next',()=>advance(1));btn(a,current.favorite?'♥ Favorite':'♡ Favorite',()=>{current.favorite=!current.favorite;render()});btn(a,'Info',()=>{dialog='info';render()});btn(a,slide?'Stop':'Slideshow',toggleSlide);btn(a,'Delete',()=>{dialog='delete';render()},'danger');}
 else{el('div','title',main,'Gallery');btn(main,search?'Cancel':'Search',()=>{search=!search;query='';render();if(search)app.querySelector('input').focus()},'tool').style.cssText='left:1330px;width:160px';btn(main,'Import',()=>{dialog='import';render()},'tool').style.cssText='left:1506px;width:160px';btn(main,'Refresh',()=>{load='ready';render()},'tool').style.cssText='left:1682px;width:174px';
 if(search){const field=el('input','search',main);field.placeholder='Search pictures';field.setAttribute('aria-label','Search pictures');field.value=query;field.oninput=()=>{};field.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();query=field.value;page=0;drawGrid(main);focusText('Apply')}};const apply=btn(main,'Search',()=>{query=field.value;page=0;drawGrid(main);apply.focus()},'tool');Object.assign(apply.style,{left:'1380px',top:'160px',width:'220px',height:'66px'});const closeSearch=btn(main,'Close',()=>{search=false;query='';page=0;render()},'tool');Object.assign(closeSearch.style,{left:'1616px',top:'160px',width:'240px',height:'66px'});}
 else el('div','heading',main,album||tab);
 drawGrid(main);const tabs=el('nav','tabs',main);for(const name of ['Pictures','Albums','Favorites'])btn(tabs,name,()=>{tab=name;album=null;query='';page=0;render()},tab===name?'selected':'');}
 if(dialog){el('div','shade',app);const d=el('section','dialog',app);d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');el('h2','',d,dialog==='delete'?'Delete photo?':dialog==='info'?'Details':'Import a photo');
 if(dialog==='delete')el('p','',d,current.title+'\nThis removes the copy imported into Gallery.');
 if(dialog==='info')el('p','',d,`${current.title}\nAlbum: ${current.album}\nDate: 2026-09-06\nFavorite: ${current.favorite?'Yes':'No'}\nImported photo`);
 let field;if(dialog==='import'){el('p','',d,'Enter the path of a JPEG or PNG image.\nGallery keeps the original photo.');field=el('input','',d);field.placeholder='Image file path';field.setAttribute('aria-label','Image file path')}
 el('div','error',d,error);const a=el('div','actions',d);const cancel=btn(a,dialog==='info'?'Close':'Cancel',()=>{dialog=null;error='';render();focusText(returnFocus)});if(dialog==='delete')btn(a,'Delete',()=>{photos=photos.filter(p=>p.id!==current.id);current=null;dialog=null;stop();render()},'danger');if(dialog==='import')btn(a,'Import',()=>{if(!field.value.trim()){error='Choose an image file.';render();return}photos.push({id:crypto.randomUUID(),title:'Imported picture',path:photos[0]?.path||'../tests/fixtures/Lake.png',album:'Gallery',owned:true,favorite:false});dialog=null;tab='Pictures';render()});cancel.focus();}
 scale();}
function drawGrid(main){main.querySelectorAll('.grid,.count,.empty,.pager').forEach(x=>x.remove());const listing=tab==='Albums'&&!album&&!search;const results=listing?[...new Set(photos.map(p=>p.album))].map(a=>({...photos.find(p=>p.album===a),title:a,album:a})):filtered();el('div','count',main,load==='loading'?'Loading pictures…':`${results.length} ${listing?'albums':'pictures'}`);if(load!=='ready'||!results.length){const e=el('div','empty',main);el('h2','',e,load==='loading'?'Loading pictures…':load==='error'?'Photos are unavailable':search?'No results':'No pictures yet');el('p','',e,load==='error'?'Refresh to try again.':search?'Try another name or return to Pictures.':'Import a photo to get started.');return}
 const grid=el('div','grid',main);for(const p of results.slice(page*8,page*8+8)){const b=btn(grid,'',()=>{if(listing){album=p.album;page=0;render()}else open(p)},'photo');b.setAttribute('aria-label',p.title);const im=el('img','',b);im.src=p.path;im.alt='';el('span','',b,(p.favorite&&!listing?'♥  ':'')+p.title)}const pager=el('div','pager',main);const prev=btn(pager,'Previous',()=>{page--;render()});prev.disabled=page===0;el('span','',pager,`${page+1} / ${Math.max(1,Math.ceil(results.length/8))}`);const next=btn(pager,'Next',()=>{page++;render()});next.disabled=(page+1)*8>=results.length;}
addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();close();return}if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Tab'].includes(e.key)||document.activeElement.tagName==='INPUT')return;const scope=dialog?app.querySelector('.dialog'):app;const buttons=[...scope.querySelectorAll('button:not(:disabled)')];let i=buttons.indexOf(document.activeElement);if(e.key==='Tab'){if(dialog){e.preventDefault();buttons[(i+(e.shiftKey?-1:1)+buttons.length)%buttons.length]?.focus()}return}e.preventDefault();const photo=document.activeElement.classList.contains('photo'),delta=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:e.key==='ArrowUp'?(photo?-4:-1):(photo?4:1);buttons[Math.max(0,Math.min(buttons.length-1,i+delta))]?.focus()});addEventListener('resize',scale);window.galleryPreview={state:s=>{load=s;render()},library:items=>{photos=items.map(p=>({...p,path:'../tests/fixtures/'+p.title+'.png'}));tab='Pictures';album=null;current=null;dialog=null;search=false;query='';page=0;render()}};render();
</script></body></html>
