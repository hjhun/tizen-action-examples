<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Samsung Gallery TV — UI Reference</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--coral:#f05f56;--ink:#17181b;--muted:#777b83;--cream:#f7f5f2}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c0c0d;font-family:"DM Sans","Noto Sans KR",sans-serif;color:var(--ink)}button{font:inherit}.canvas{position:absolute;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--cream)}.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transition:.3s}.screen.active{opacity:1;visibility:visible}
    .topbar{position:absolute;left:82px;right:82px;top:52px;height:106px;display:flex;align-items:flex-start;z-index:10}.title h1{font-size:58px;line-height:1;margin:0;letter-spacing:-.055em}.title p{font-size:17px;color:#858890;margin:12px 0 0}.top-actions{margin-left:auto;display:flex;gap:12px}.icon-btn{width:58px;height:58px;border:0;border-radius:20px;background:#fff;display:grid;place-items:center;font-size:24px;color:#4f535b;box-shadow:0 8px 25px rgba(34,31,29,.08)}.icon-btn.focused,.icon-btn:focus{outline:5px solid var(--coral);outline-offset:3px;color:var(--coral)}
    .pictures{background:#f8f7f4}.photo-content{position:absolute;left:82px;right:82px;top:176px;bottom:142px;display:grid;grid-template-columns:1fr 1.35fr;gap:44px}.day h2{font-size:27px;margin:0 0 15px;letter-spacing:-.03em}.day h2 span{font-size:16px;color:#94979e;font-weight:500;margin-left:10px}.mosaic{height:622px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:9px}.photo{border-radius:17px;background-position:center;background-size:cover;position:relative;overflow:hidden}.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 70%,rgba(0,0,0,.18))}.photo.focused{outline:6px solid #fff;box-shadow:0 0 0 11px var(--coral);z-index:2}.photo.tall{grid-row:span 2}.photo.wide{grid-column:span 2}.p1{background-image:url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=85')}.p2{background-image:url('https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=85')}.p3{background-image:url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=85')}.p4{background-image:url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=85')}.p5{background-image:url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=900&q=85')}.p6{background-image:url('https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=900&q=85')}.p7{background-image:url('https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=900&q=85')}.p8{background-image:url('https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=900&q=85')}
    .gallery-dock{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);height:86px;padding:0 20px;border-radius:32px;background:rgba(255,255,255,.94);box-shadow:0 20px 55px rgba(44,37,32,.16);display:flex;align-items:center;gap:8px;z-index:40;backdrop-filter:blur(20px)}.gallery-dock button{width:132px;height:62px;border:0;border-radius:22px;background:transparent;color:#696d75;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:9px}.gallery-dock button b{font-size:24px}.gallery-dock button.active,.gallery-dock button:focus{background:#fff0ee;color:#db4d45;outline:4px solid var(--coral);outline-offset:2px}
    .albums{background:#f6f4f1}.album-layout{position:absolute;left:82px;right:82px;top:178px;bottom:150px}.search-box{height:70px;width:640px;border-radius:25px;background:#ebe8e4;display:flex;align-items:center;padding:0 26px;color:#85878d;font-size:19px;gap:15px}.filter-row{display:flex;gap:10px;margin:25px 0 22px}.filter{border:0;border-radius:999px;background:#ebe8e4;padding:12px 22px;color:#62666d;font-weight:700}.filter.active{background:#23262c;color:#fff;outline:4px solid #f08a84}.album-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:26px}.album-cover{height:390px}.cover{height:302px;border-radius:28px;background-position:center;background-size:cover;box-shadow:0 14px 35px rgba(40,35,31,.12)}.album-cover.focused .cover{outline:6px solid var(--coral);outline-offset:6px}.album-cover h3{font-size:21px;margin:16px 2px 2px}.album-cover p{font-size:15px;color:#858890;margin:0}.cover.family{background-image:url('https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=700&q=85')}.cover.travel{background-image:url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=700&q=85')}.cover.food{background-image:url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=700&q=85')}.cover.city{background-image:url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=700&q=85')}.cover.nature{background-image:url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=700&q=85')}
    .viewer{background:#050506;color:#fff}.viewer-photo{position:absolute;inset:54px 180px 160px;border-radius:24px;background:url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1800&q=92') center/cover;box-shadow:0 22px 80px rgba(0,0,0,.4)}.viewer-photo:after{content:"";position:absolute;inset:0;border-radius:24px;background:linear-gradient(180deg,rgba(0,0,0,.42),transparent 25%,transparent 68%,rgba(0,0,0,.52))}.viewer-head{position:absolute;left:214px;right:214px;top:84px;z-index:5;display:flex;align-items:center}.back{width:60px;height:60px;border:0;border-radius:22px;background:rgba(15,15,17,.56);color:#fff;font-size:30px}.viewer-meta{margin-left:20px}.viewer-meta h2{font-size:25px;margin:0}.viewer-meta p{margin:5px 0 0;color:#ddd}.viewer-head .more{margin-left:auto}.photo-info{position:absolute;left:230px;bottom:190px;z-index:5}.photo-info h3{font-size:31px;margin:0 0 7px}.photo-info p{margin:0;color:#e1e3e7}.viewer-tools{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);height:92px;border-radius:34px;background:rgba(30,30,33,.88);backdrop-filter:blur(24px);display:flex;gap:8px;align-items:center;padding:0 20px;z-index:9}.viewer-tools button{width:116px;height:66px;border:0;border-radius:22px;background:transparent;color:#d8d9dd;font-weight:700;display:flex;gap:8px;align-items:center;justify-content:center}.viewer-tools button.active,.viewer-tools button:focus{background:#fff;color:#17181b;outline:5px solid var(--coral)}
    .screen-tabs{position:absolute;right:82px;top:122px;z-index:60;display:flex;gap:8px;padding:8px;border-radius:18px;background:rgba(21,22,25,.76);backdrop-filter:blur(18px)}.screen-tabs button{border:0;background:transparent;color:#bfc2c8;border-radius:12px;padding:10px 17px;font-weight:700}.screen-tabs button.active,.screen-tabs button:focus{background:#fff;color:#1a1b1e;outline:3px solid #f47a72}.hint{position:absolute;left:82px;bottom:55px;z-index:60;font-size:15px;color:#878b92}
  </style>
</head>
<body><div id="viewport"><main class="canvas" id="canvas">
  <nav class="screen-tabs"><button class="active" data-screen="pictures">1 Pictures</button><button data-screen="albums">2 Albums</button><button data-screen="viewer">3 Photo</button></nav>
  <section class="screen pictures active" data-view="pictures"><header class="topbar"><div class="title"><h1>사진</h1><p>모든 순간을 날짜순으로 모았습니다</p></div><div class="top-actions"><button class="icon-btn focused">⌕</button><button class="icon-btn">＋</button><button class="icon-btn">•••</button></div></header>
    <div class="photo-content"><div class="day"><h2>오늘 <span>8월 9일</span></h2><div class="mosaic"><div class="photo p1 tall focused" data-jump="viewer"></div><div class="photo p2"></div><div class="photo p3"></div><div class="photo p4 wide"></div><div class="photo p5"></div><div class="photo p6"></div></div></div><div class="day"><h2>어제 <span>8월 8일 · 서울</span></h2><div class="mosaic"><div class="photo p7 wide"></div><div class="photo p8 tall"></div><div class="photo p3"></div><div class="photo p5 tall"></div><div class="photo p2"></div><div class="photo p4"></div></div></div></div>
    <nav class="gallery-dock"><button class="active"><b>▦</b>사진</button><button data-jump="albums"><b>▣</b>앨범</button><button><b>◇</b>스토리</button><button><b>☰</b>메뉴</button></nav><div class="hint">촬영일과 위치로 묶인 Pictures grid · 사진을 선택하면 크게 보기</div></section>
  <section class="screen albums" data-view="albums"><header class="topbar"><div class="title"><h1>앨범</h1><p>사진과 동영상을 주제별로 찾아보세요</p></div><div class="top-actions"><button class="icon-btn focused">⌕</button><button class="icon-btn">＋</button><button class="icon-btn">•••</button></div></header>
    <div class="album-layout"><div class="search-box"><span>⌕</span>사진, 사람, 장소 또는 날짜 검색</div><div class="filter-row"><button class="filter active">모든 앨범</button><button class="filter">즐겨찾기</button><button class="filter">최근 항목</button><button class="filter">공유됨</button></div><div class="album-grid"><article class="album-cover focused"><div class="cover family"></div><h3>가족</h3><p>124개 항목</p></article><article class="album-cover"><div class="cover travel"></div><h3>여행</h3><p>89개 항목</p></article><article class="album-cover"><div class="cover food"></div><h3>맛있는 순간</h3><p>47개 항목</p></article><article class="album-cover"><div class="cover city"></div><h3>서울</h3><p>212개 항목</p></article><article class="album-cover"><div class="cover nature"></div><h3>자연</h3><p>73개 항목</p></article></div></div>
    <nav class="gallery-dock"><button data-jump="pictures"><b>▦</b>사진</button><button class="active"><b>▣</b>앨범</button><button><b>◇</b>스토리</button><button><b>☰</b>메뉴</button></nav></section>
  <section class="screen viewer" data-view="viewer"><div class="viewer-photo"></div><header class="viewer-head"><button class="back" data-jump="pictures">‹</button><div class="viewer-meta"><h2>한강의 아침</h2><p>2026년 8월 9일 오전 7:42 · 서울</p></div><button class="back more">•••</button></header><div class="photo-info"><h3>한강의 아침</h3><p>4032 × 3024 · 4.8 MB · Galaxy Camera</p></div><nav class="viewer-tools"><button>♡　즐겨찾기</button><button>✎　편집</button><button class="active">⌁　공유</button><button>ⓘ　정보</button><button>♲　삭제</button></nav></section>
  </main></div>
  <script>
    const c=document.getElementById('canvas'),tabs=[...document.querySelectorAll('.screen-tabs button')];let selected=0;function scale(){const s=Math.min(innerWidth/1920,innerHeight/1080);c.style.transform=`scale(${s})`;c.style.left=`${(innerWidth-1920*s)/2}px`;c.style.top=`${(innerHeight-1080*s)/2}px`}function show(n){document.querySelectorAll('.screen').forEach(v=>v.classList.toggle('active',v.dataset.view===n));tabs.forEach((b,i)=>{b.classList.toggle('active',b.dataset.screen===n);if(b.dataset.screen===n)selected=i})}tabs.forEach(b=>b.onclick=()=>show(b.dataset.screen));document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>show(b.dataset.jump));addEventListener('keydown',e=>{if(e.key==='ArrowRight')selected=(selected+1)%tabs.length;if(e.key==='ArrowLeft')selected=(selected+tabs.length-1)%tabs.length;if(e.key.startsWith('Arrow'))tabs[selected].focus();if(e.key==='Enter')show(tabs[selected].dataset.screen)});addEventListener('resize',scale);scale();
  </script>
</body></html>
