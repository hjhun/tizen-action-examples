<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser — executable NUI preview</title>
<style>
:root{color-scheme:light;--ink:#1b1b1f;--muted:#61616a;--line:#dedee5;--surface:#fff;--canvas:#f7f7fa;--active:#0b57d0;--focus:#134f9e;--danger:#b3261e;--scale:1}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#202124;display:grid;place-items:center;font-family:"Noto Sans KR","Segoe UI",sans-serif;color:var(--ink)}
#frame{width:min(100vw,calc(100vh * 1.7778));aspect-ratio:16/9;background:var(--canvas);overflow:hidden;position:relative;box-shadow:0 10px 32px #0008;transform:translateZ(0)}
.app{width:1920px;height:1080px;transform:scale(var(--scale));transform-origin:top left;position:absolute;background:var(--canvas);display:flex;flex-direction:column}
.header{height:120px;background:var(--surface);display:flex;gap:10px;align-items:center;padding:24px 52px;border-bottom:1px solid var(--line)}
.brand{width:190px;font-size:30px;font-weight:750;letter-spacing:-.7px}.controls{display:flex;gap:10px}.icon,.tabs{height:66px;min-width:66px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:19px;font-weight:700;color:var(--ink)}.tabs{margin-left:10px;padding:0 24px;min-width:150px}.icon[disabled]{color:#aaa;background:#f4f4f6;border-color:#e8e8ec}
.address{height:66px;min-width:0;flex:1;border:2px solid #777782;border-radius:16px;background:#f3f3f6;display:flex;align-items:center;gap:15px;padding:0 20px}.address:focus-within{border-color:var(--focus);background:#fff;box-shadow:0 0 0 4px #134f9e33}.address span{color:var(--muted);font-size:24px}.address input{border:0;outline:0;background:transparent;min-width:0;flex:1;font-size:25px;color:var(--ink)}
main{padding:28px 52px 44px;flex:1;min-height:0;display:flex;flex-direction:column;gap:22px}.context{height:45px;display:flex;align-items:center;gap:18px;color:var(--muted);font-size:21px}.context strong{color:var(--ink);font-size:25px}.loadbar{height:5px;background:transparent}.loadbar i{display:block;height:5px;width:0;background:var(--active);transition:width .35s ease}.surface{flex:1;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative}.page{height:100%;padding:78px 90px;display:flex;flex-direction:column;align-items:flex-start}.page h1{font-size:52px;line-height:1.1;letter-spacing:-1.8px;margin:0 0 22px}.page p{font-size:26px;line-height:1.55;max-width:920px;margin:0 0 30px;color:#45454e}.page .rule{width:96px;height:6px;background:var(--active);margin-bottom:38px}.page small{font-size:20px;color:var(--muted)}
button,[data-focus]{cursor:pointer}button:focus-visible,[data-focus].focus{outline:5px solid var(--focus);outline-offset:3px;box-shadow:0 7px 15px #0002;transform:scale(1.025)}.tabs-view{padding:55px 90px}.tabs-view h1{font-size:44px;margin:0 0 36px}.tab-row{width:100%;height:120px;background:#fff;border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:1fr auto;align-items:center;padding:20px 22px;margin:14px 0;text-align:left}.tab-row.selected{border:3px solid var(--active)}.tab-title{font-size:26px;font-weight:700}.tab-url{font-size:19px;color:var(--muted);margin-top:7px}.close{height:62px;padding:0 20px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:20px}.new-tab{margin-top:20px;height:68px;padding:0 28px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:22px;font-weight:700}
.overlay{position:absolute;inset:0;background:#0006;display:grid;place-items:center;padding:50px}.modal{width:680px;background:#fff;border-radius:22px;padding:42px;box-shadow:0 20px 50px #0007}.modal h2{font-size:38px;margin:0 0 16px}.modal p{font-size:23px;line-height:1.45;color:#4f4f59;margin:0 0 34px}.actions{display:flex;justify-content:flex-end;gap:14px}.actions button{height:64px;border-radius:13px;padding:0 26px;font-size:21px;font-weight:750;border:1px solid var(--line);background:#fff}.actions .primary{background:var(--active);color:#fff;border-color:var(--active)}.actions .danger{background:var(--danger);border-color:var(--danger);color:#fff}.hidden{display:none!important}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:700px){body{place-items:start}#frame{width:100vw;height:100vh;aspect-ratio:auto}.header{padding:18px 32px}.brand{display:none}main{padding:22px 32px}.controls{gap:7px}.icon{min-width:58px}.tabs{min-width:100px;padding:0 14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="frame"><div class="app" id="app" aria-label="Browser preview">
<header class="header"><div class="brand">Browser</div><div class="controls"><button class="icon" id="back" aria-label="Back" disabled>←</button><button class="icon" id="forward" aria-label="Forward" disabled>→</button><button class="icon" id="reload" aria-label="Reload">↻</button></div><label class="address" aria-label="Address or search"><span>⌕</span><input id="address" data-focus value="https://www.tizen.org/" aria-label="Address or search"><span class="sr">Press Enter to load</span></label><button class="tabs" id="tabs" aria-label="Open tabs">Tabs <b id="count">1</b></button></header>
<main><div class="context"><strong id="title">Tizen</strong><span id="url">https://www.tizen.org/</span></div><div class="loadbar" aria-label="Loading"><i id="progress"></i></div><section class="surface" id="surface" tabindex="-1" aria-label="Current web page"></section></main>
<div class="overlay hidden" id="modal-layer"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title"></h2><p id="modal-copy"></p><div class="actions" id="modal-actions"></div></section></div>
</div></div>
<script>
(()=>{const $=id=>document.getElementById(id), frame=$("frame"), app=$("app"), address=$("address"), surface=$("surface"), modal=$("modal-layer");let view="page",lastFocus=address,modalState=null;let tabs=[{title:"Tizen",url:"https://www.tizen.org/"}],selected=0;let focusables=[];
function scale(){const w=frame.clientWidth,h=frame.clientHeight;app.style.setProperty('--scale',Math.min(w/1920,h/1080));}new ResizeObserver(scale).observe(frame);scale();
function current(){return tabs[selected]}function setButtons(){ $('back').disabled=true;$('forward').disabled=true;$('count').textContent=tabs.length;}
function renderPage(kind='page'){view='page';const t=current();$('title').textContent=t.title;$('url').textContent=t.url;surface.innerHTML=kind==='offline'?`<div class="page"><div class="rule"></div><h1>You’re offline</h1><p>Check the connection and try again. Your address is still ready to edit.</p><small>Offline state from the planned WebView load-error mapping.</small></div>`:kind==='error'?`<div class="page"><div class="rule"></div><h1>This page can’t open</h1><p>The browser engine could not complete this request. Try again or return to the previous screen.</p><small>Bounded WebView error text only; no page body is exposed.</small></div>`:`<div class="page"><div class="rule"></div><h1>${escape(t.title)}</h1><p>Current page content is rendered by the target system WebView. This local preview represents the same content region and navigation state without remote content.</p><small>${escape(t.url)}</small></div>`;setButtons();refreshFocus();}
function renderTabs(){view='tabs';surface.innerHTML=`<div class="tabs-view"><h1>Tabs</h1>${tabs.map((t,i)=>`<div class="tab-row ${i===selected?'selected':''}" data-tab="${i}" tabindex="0" aria-label="${escape(t.title)}, ${i===selected?'current tab':''}"><div><div class="tab-title">${escape(t.title)}</div><div class="tab-url">${escape(t.url)}</div></div><button class="close" data-close="${i}" aria-label="Close ${escape(t.title)}">Close</button></div>`).join('')}<button class="new-tab" id="newtab">New tab</button></div>`;setButtons();refreshFocus();}
function escape(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){const raw=address.value.trim();if(!raw)return;lastFocus=address;$('progress').style.width='26%';setTimeout(()=>{$('progress').style.width='78%'},120);setTimeout(()=>{$('progress').style.width='100%';if(raw.includes('offline')){renderPage('offline')}else if(raw.includes('error')){renderPage('error')}else{const url=/^https?:\/\//.test(raw)?raw:'https://search.local/?q='+encodeURIComponent(raw);tabs[selected]={title:url.includes('search.local')?'Search results':'Tizen',url};renderPage()}setTimeout(()=>$('progress').style.width='0',220)},420)}
function dialog(type,index){modalState={type,index};modal.classList.remove('hidden');$('modal-title').textContent=type==='close'?'Close this tab?':type==='offline'?'Connection unavailable':'Browser engine unavailable';$('modal-copy').textContent=type==='close'?'The current normal-mode tab will be closed.':'Retry keeps the address available and returns to this loading state.';$('modal-actions').innerHTML=type==='close'?'<button id="cancel">Cancel</button><button class="danger" id="confirm">Close tab</button>':'<button id="cancel">Back</button><button class="primary" id="confirm">Retry</button>';refreshFocus();$('cancel').focus();}
function dismiss(confirm=false){const state=modalState;modal.classList.add('hidden');modalState=null;if(confirm&&state.type==='close'){tabs.splice(state.index,1);if(!tabs.length)tabs=[{title:'New tab',url:'https://www.tizen.org/'}];selected=Math.min(selected,tabs.length-1);renderTabs();setTimeout(()=>$('[data-tab="'+selected+'"]')?.focus(),0)}else if(confirm){load()}else{(lastFocus||address).focus()}refreshFocus()}
function refreshFocus(){focusables=[...app.querySelectorAll('button:not([disabled]),input,[data-tab]')].filter(x=>!x.closest('.hidden'));}
function activate(e){const target=e.target.closest('button,[data-tab]');if(!target)return;if(target.id==='tabs'){lastFocus=target;renderTabs();setTimeout(()=>app.querySelector('[data-tab="'+selected+'"]').focus(),0)}else if(target.id==='reload')load();else if(target.id==='newtab'){tabs.push({title:'New tab',url:'https://www.tizen.org/'});selected=tabs.length-1;renderTabs();setTimeout(()=>app.querySelector('[data-tab="'+selected+'"]').focus(),0)}else if(target.dataset.close!==undefined){lastFocus=target;dialog('close',+target.dataset.close)}else if(target.dataset.tab!==undefined){selected=+target.dataset.tab;renderPage();address.focus()}else if(target.id==='cancel')dismiss(false);else if(target.id==='confirm')dismiss(true)}app.addEventListener('click',activate);address.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();load()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();if(!modal.classList.contains('hidden'))dismiss(false);else if(view==='tabs'){renderPage();$('tabs').focus()}else if(!$('back').disabled)$('back').click();return}if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();refreshFocus();let i=focusables.indexOf(document.activeElement);if(i<0)i=0;const delta=e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:1;focusables[(i+delta+focusables.length)%focusables.length]?.focus()}if(e.key==='Enter'&&document.activeElement!==address){document.activeElement.click?.()}});renderPage();address.focus();
window.__browserPreview={load,renderTabs,renderPage,dialog};})();
</script>
</body></html>
