<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser — executable NUI preview</title>
<style>
:root {
  color-scheme: light;
  --ink: #17171b;
  --muted: #5d5d66;
  --quiet: #85858e;
  --line: #d8d8df;
  --surface: #ffffff;
  --canvas: #f6f6f8;
  --soft: #eeeeF2;
  --blue: #0877e8;
  --focus: #0868d7;
  --danger: #d92d2d;
  --success: #256d3b;
  --scale: 1;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body {
  background: #17181b;
  color: var(--ink);
  font-family: "SamsungOne", "Noto Sans KR", "Segoe UI", sans-serif;
  display: grid;
  place-items: center;
}
button, input { font: inherit; }
#viewport {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #17181b;
}
#app {
  position: absolute;
  width: 1920px;
  height: 1080px;
  transform: scale(var(--scale));
  transform-origin: top left;
  overflow: hidden;
  background: var(--canvas);
}
.browser-header {
  height: 118px;
  padding: 24px 52px;
  display: grid;
  grid-template-columns: 226px minmax(720px, 1fr) 72px;
  gap: 20px;
  align-items: center;
  background: var(--canvas);
}
.product-name {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  font-size: 27px;
  font-weight: 760;
  letter-spacing: -.8px;
}
.product-mark {
  width: 44px;
  height: 44px;
  border: 3px solid var(--ink);
  border-radius: 14px 14px 18px 18px;
  position: relative;
}
.product-mark::after {
  content: "";
  position: absolute;
  left: 9px;
  right: 9px;
  top: 11px;
  height: 3px;
  border-radius: 9px;
  background: var(--blue);
  box-shadow: 0 8px 0 var(--blue);
}
.control {
  height: 66px;
  border: 2px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  color: var(--ink);
  font-size: 22px;
  font-weight: 720;
  cursor: pointer;
  transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease, background 120ms ease;
}
.control[disabled] {
  color: #a0a0a8;
  background: #f1f1f4;
  border-color: #e6e6ea;
  cursor: default;
}
.address-shell {
  height: 70px;
  border: 2px solid transparent;
  border-radius: 27px;
  background: #e9e9ed;
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) auto;
  gap: 13px;
  align-items: center;
  padding: 0 20px;
  transition: background 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
}
.address-shell:focus-within {
  background: var(--surface);
  border-color: var(--focus);
  box-shadow: 0 0 0 5px rgba(8, 104, 215, .18), 0 10px 25px rgba(25, 38, 64, .10);
}
.address-icon { color: var(--muted); font-size: 25px; }
#address {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font-size: 25px;
  letter-spacing: -.3px;
}
.security-label { color: var(--success); font-size: 17px; font-weight: 700; }
.reload-control { width: 70px; height: 70px; border-radius: 25px; font-size: 27px; }
.tabs-control { padding: 0 20px; display: flex; align-items: center; justify-content: center; gap: 12px; }
.tab-count {
  min-width: 30px;
  height: 30px;
  border: 2px solid currentColor;
  border-radius: 9px;
  display: inline-grid;
  place-items: center;
  font-size: 16px;
}
.workspace {
  height: 962px;
  padding: 0 40px 32px;
  display: grid;
  grid-template-rows: 6px minmax(0, 1fr);
}
.progress-track { height: 6px; background: transparent; overflow: hidden; }
#progress {
  display: block;
  height: 100%;
  width: 0;
  background: var(--blue);
  transform-origin: left;
  transition: width 180ms ease;
}
#progress.loading { width: 72%; animation: progress-pulse 900ms ease-in-out infinite alternate; }
@keyframes progress-pulse { from { transform: scaleX(.74); opacity: .78; } to { transform: scaleX(1); opacity: 1; } }
.web-shell {
  position: relative;
  min-height: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 26px;
  background: var(--surface);
}
.bottom-dock {
  position: absolute;
  z-index: 12;
  left: 50%;
  bottom: 28px;
  width: 592px;
  height: 92px;
  padding: 10px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  transform: translateX(-50%);
  border: 1px solid #d7d7dc;
  border-radius: 34px;
  background: #fff;
  box-shadow: 0 18px 44px rgba(27, 28, 34, .17);
}
.dock-control {
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  border: 0;
  border-radius: 25px;
  background: transparent;
  color: var(--ink);
  font-size: 20px;
  font-weight: 740;
}
.dock-control .dock-icon { font-size: 27px; font-weight: 500; }
.dock-control[disabled] { color: #aaaab2; background: #f4f4f6; }
#surface { position: absolute; inset: 0; overflow: hidden; }
.state-page { position: absolute; inset: 0; }
.home-state {
  padding: 110px 122px 170px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: var(--surface);
}
.eyebrow { color: var(--blue); font-size: 18px; font-weight: 800; letter-spacing: 1.8px; text-transform: uppercase; }
.home-state h1, .fixture-page h1, .recovery h1, .tabs-view h1 {
  margin: 16px 0 24px;
  color: var(--ink);
  font-size: 64px;
  line-height: 1.08;
  letter-spacing: -2.2px;
}
.lead { margin: 0; max-width: 1040px; color: #45454d; font-size: 27px; line-height: 1.52; letter-spacing: -.25px; }
.home-actions { margin-top: 42px; display: flex; gap: 16px; }
.action-button {
  min-height: 68px;
  padding: 0 28px;
  border: 2px solid var(--line);
  border-radius: 17px;
  background: var(--surface);
  color: var(--ink);
  font-size: 21px;
  font-weight: 760;
  cursor: pointer;
}
.action-button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.action-button.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.privacy-line { margin-top: 34px; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 18px; }
.privacy-line .shield { width: 32px; height: 36px; border: 3px solid var(--success); border-radius: 15px 15px 18px 18px; display: grid; place-items: center; color: var(--success); font-weight: 800; }
.fixture-page { padding: 74px 92px; background: var(--surface); }
.fixture-page .article-rule { width: 92px; height: 7px; margin-bottom: 34px; border-radius: 99px; background: var(--blue); }
.fixture-page .article-grid { display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 92px; }
.fixture-page p { max-width: 970px; margin: 0 0 24px; color: #424249; font-size: 25px; line-height: 1.62; }
.fixture-page aside { border-left: 1px solid var(--line); padding-left: 38px; }
.fixture-page aside strong { display: block; margin-bottom: 16px; font-size: 22px; }
.fixture-page aside span { color: var(--muted); font-size: 19px; line-height: 1.55; }
.loading-mask { position: absolute; inset: 0; background: rgba(255, 255, 255, .78); display: grid; place-items: center; }
.loading-card { width: 610px; text-align: center; }
.loading-ring { width: 62px; height: 62px; margin: 0 auto 26px; border: 6px solid #d9dfea; border-top-color: var(--blue); border-radius: 50%; animation: spin 900ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-card h2 { margin: 0 0 10px; font-size: 34px; }
.loading-card p { margin: 0; color: var(--muted); font-size: 21px; }
.recovery {
  padding: 92px 110px;
  display: grid;
  grid-template-columns: 120px minmax(0, 1fr);
  gap: 44px;
  align-content: center;
  background: #fbfbfc;
}
.recovery-icon {
  width: 106px;
  height: 106px;
  border: 3px solid #c3c3ca;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: 46px;
  font-weight: 700;
}
.recovery h1 { margin-top: 0; }
.recovery p { max-width: 900px; margin: 0; color: var(--muted); font-size: 25px; line-height: 1.55; }
.recovery .home-actions { grid-column: 2; }
.tabs-open .browser-header, .tabs-open .bottom-dock { visibility: hidden; }
.tabs-open .workspace { position: absolute; inset: 0; width: 1920px; height: 1080px; padding: 0; display: block; }
.tabs-open .progress-track { display: none; }
.tabs-open .web-shell { position: absolute; inset: 0; border: 0; border-radius: 0; }
.tabs-view { padding: 48px 110px 52px; height: 100%; overflow: hidden; background: #f7f7f9; }
.tabs-heading { height: 104px; display: grid; grid-template-columns: 76px 1fr auto; gap: 24px; align-items: center; }
.tabs-back { width: 66px; height: 66px; border-radius: 23px; }
.tabs-heading h1 { margin: 0; font-size: 58px; letter-spacing: -2px; }
.tabs-heading p { margin: 0; padding: 12px 18px; border-radius: 999px; background: #ececf0; color: var(--muted); font-size: 18px; font-weight: 720; }
.tab-list { width: 1320px; margin: 34px auto 0; display: grid; gap: 14px; max-height: 680px; overflow-y: auto; padding: 6px 12px 6px 8px; scrollbar-width: thin; }
.tab-row {
  position: relative;
  min-height: 142px;
  display: grid;
  grid-template-columns: 150px 1fr 92px;
  align-items: stretch;
  border: 2px solid #dedee4;
  border-radius: 26px;
  background: var(--surface);
  overflow: hidden;
}
.tab-row.selected { border-color: #b7d7fb; background: #edf5ff; box-shadow: inset 9px 0 0 var(--blue); }
.tab-preview { margin: 17px 8px 17px 24px; border-radius: 18px; background: #e7edf6; display: grid; place-items: center; color: var(--blue); font-size: 31px; font-weight: 800; }
.tab-row.selected .tab-preview { background: #fff; }
.tab-open {
  min-width: 0;
  padding: 28px 26px;
  border: 0;
  border-radius: 18px 0 0 18px;
  background: transparent;
  text-align: left;
  cursor: pointer;
}
.tab-open strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font-size: 27px; }
.tab-open span { display: block; margin-top: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 19px; }
.tab-close { align-self: center; width: 66px; height: 66px; margin-right: 18px; border-radius: 50%; font-size: 27px; }
.tabs-footer { width: 1320px; margin: 24px auto 0; display: flex; justify-content: space-between; align-items: center; }
.limit-note { color: var(--quiet); font-size: 18px; }
.modal-layer { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; padding: 60px; background: rgba(17, 17, 20, .48); }
.modal {
  width: 760px;
  padding: 46px 0 0;
  overflow: hidden;
  border-radius: 34px;
  background: var(--surface);
  box-shadow: 0 28px 72px rgba(0, 0, 0, .28);
}
.modal h2 { margin: 0; padding: 0 48px; font-size: 39px; letter-spacing: -1.1px; }
.modal p { margin: 18px 0 38px; padding: 0 48px; color: var(--muted); font-size: 22px; line-height: 1.5; }
.modal-actions { height: 104px; display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
.modal-action { border: 0; border-radius: 0; background: transparent; font-size: 23px; font-weight: 760; }
.modal-action + .modal-action { border-left: 1px solid var(--line); }
.modal-action.danger { color: var(--danger); }
.verification-tray {
  position: absolute;
  right: 22px;
  bottom: 20px;
  z-index: 30;
  display: flex;
  flex-wrap: wrap;
  width: 710px;
  gap: 8px;
  padding: 10px;
  border: 1px solid #333;
  border-radius: 14px;
  background: rgba(17, 17, 20, .92);
}
.verification-tray button { height: 36px; border: 0; border-radius: 9px; padding: 0 12px; background: #fff; color: #111; font-size: 14px; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button:focus-visible, [tabindex="0"]:focus-visible {
  position: relative;
  z-index: 2;
  outline: 5px solid var(--focus);
  outline-offset: 4px;
  border-color: var(--focus);
  box-shadow: 0 12px 28px rgba(18, 34, 59, .18);
  transform: scale(1.025);
}
.tab-open:focus-visible {
  border-radius: 16px;
  outline-offset: -6px;
  background: #edf4ff;
  box-shadow: inset 0 0 0 5px var(--focus);
  transform: none;
}
.modal-action:focus-visible { outline-offset: -8px; border-radius: 18px; transform: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="viewport">
  <main id="app" aria-label="Browser preview">
    <header class="browser-header">
      <div class="product-name" aria-label="Browser"><span class="product-mark" aria-hidden="true"></span><span>Browser</span></div>
      <label class="address-shell" aria-label="Address or search">
        <span class="address-icon" aria-hidden="true">⌕</span>
        <input id="address" data-row="0" data-col="0" aria-label="Address or search. Press Enter to load." placeholder="Search or enter address" autocomplete="off" spellcheck="false">
        <span class="security-label" id="security-label">Web</span>
      </label>
      <button class="control reload-control" id="reload" data-row="0" data-col="1" aria-label="Reload current page">↻</button>
    </header>
    <section class="workspace">
      <div class="progress-track" aria-hidden="true"><i id="progress"></i></div>
      <section class="web-shell" aria-label="Browser content region">
        <div id="surface"></div>
      </section>
    </section>
    <nav class="bottom-dock" aria-label="Browser navigation">
      <button class="dock-control" id="back" data-row="2" data-col="0" aria-label="Back" disabled><span class="dock-icon" aria-hidden="true">←</span><span>Back</span></button>
      <button class="dock-control" id="forward" data-row="2" data-col="1" aria-label="Forward" disabled><span class="dock-icon" aria-hidden="true">→</span><span>Forward</span></button>
      <button class="dock-control tabs-control" id="tabs" data-row="2" data-col="2" aria-label="Open tabs"><span class="dock-icon" aria-hidden="true">▣</span><span>Tabs</span><span class="tab-count" id="tab-count">1</span></button>
    </nav>
    <div class="modal-layer hidden" id="modal-layer">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-copy">
        <h2 id="modal-title">Close this tab?</h2>
        <p id="modal-copy"></p>
        <div class="modal-actions">
          <button class="modal-action" id="modal-cancel" data-row="0" data-col="0">Cancel</button>
          <button class="modal-action danger" id="modal-confirm" data-row="0" data-col="1">Close</button>
        </div>
      </section>
    </div>
    <strong class="sr-only" id="page-title">Start page</strong>
    <span class="sr-only" id="page-url">Normal browsing · local start surface</span>
    <span class="sr-only" id="state-label">Ready</span>
    <aside class="verification-tray hidden" id="verification-tray" aria-label="Preview verification states"></aside>
    <div class="sr-only" id="live-status" aria-live="polite"></div>
  </main>
</div>
<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const viewport = $("viewport");
  const app = $("app");
  const surface = $("surface");
  const address = $("address");
  const modalLayer = $("modal-layer");
  const focusMemory = new Map();
  const state = {
    mode: "home",
    tabs: [createTab("tab-1")],
    selectedTabId: "tab-1",
    pendingCloseId: null,
    lastWorkspaceMode: "home",
    navigationTimer: null,
    navigationIntent: 0,
    exitRequested: false,
  };

  function createTab(id, page = null) {
    return { id, history: page ? [page] : [], historyIndex: page ? 0 : -1 };
  }

  function selectedTab() {
    return state.tabs.find(tab => tab.id === state.selectedTabId) || state.tabs[0];
  }

  function currentPage(tab = selectedTab()) {
    return tab.historyIndex >= 0 ? tab.history[tab.historyIndex] : null;
  }

  function scaleCanvas() {
    const scale = Math.min(viewport.clientWidth / 1920, viewport.clientHeight / 1080);
    app.style.setProperty("--scale", String(scale));
    app.style.left = `${(viewport.clientWidth - 1920 * scale) / 2}px`;
    app.style.top = `${(viewport.clientHeight - 1080 * scale) / 2}px`;
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, character => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
    })[character]);
  }

  function publicUrl(value) {
    try {
      const parsed = new URL(value);
      return `${parsed.origin}${parsed.pathname}`;
    } catch {
      return value;
    }
  }

  function announce(message) {
    $("live-status").textContent = message;
  }

  function setChrome(title, url, label) {
    $("page-title").textContent = title;
    $("page-url").textContent = url;
    $("state-label").textContent = label;
    $("tab-count").textContent = String(state.tabs.length);
    const tab = selectedTab();
    $("back").disabled = state.mode === "tabs" || tab.historyIndex <= 0;
    $("forward").disabled = state.mode === "tabs" || tab.historyIndex < 0 || tab.historyIndex >= tab.history.length - 1;
    $("reload").disabled = state.mode === "loading" || state.mode === "tabs";
    $("security-label").textContent = url.startsWith("https://") ? "HTTPS" : "Web";
  }

  function renderHome() {
    app.classList.remove("tabs-open");
    state.mode = "home";
    state.lastWorkspaceMode = "home";
    $("progress").className = "";
    setChrome("Start page", "Normal browsing · local start surface", "Ready");
    surface.innerHTML = `
      <section class="state-page home-state" aria-label="Start page">
        <div class="eyebrow">Start page</div>
        <h1>Browse the web.</h1>
        <p class="lead">Search or enter an address above. Pages open in the system WebView. Use remote, keyboard, pointer, or touch.</p>
        <div class="home-actions">
          <button class="action-button primary" data-command="fixture" data-row="1" data-col="0">Open Tizen guide</button>
          <button class="action-button" data-command="focus-address" data-row="1" data-col="1">Enter an address</button>
        </div>
        <div class="privacy-line"><span class="shield" aria-hidden="true">✓</span><span>Normal browsing only · public title and address metadata</span></div>
      </section>`;
  }

  function renderPage(page = currentPage()) {
    if (!page) { renderHome(); return; }
    app.classList.remove("tabs-open");
    state.mode = "page";
    state.lastWorkspaceMode = "page";
    $("progress").className = "";
    address.value = page.url;
    setChrome(page.title, publicUrl(page.url), "Loaded");
    surface.innerHTML = `
      <article class="state-page fixture-page" tabindex="0" data-row="1" data-col="0" aria-label="Current web page. ${escapeHtml(page.title)}">
        <div class="article-rule"></div>
        <div class="article-grid">
          <div>
            <div class="eyebrow">Local privacy-safe fixture</div>
            <h1>${escapeHtml(page.title)}</h1>
            <p>The installed Browser renders reachable content through the target system WebView. This executable preview uses a local article so UI behavior can be tested without copying a remote page or exposing browsing data.</p>
            <p>Address, title, loading state, focus, and recovery actions follow the same bounded product contract planned for NUI.</p>
          </div>
          <aside><strong>Current page context</strong><span>${escapeHtml(publicUrl(page.url))}<br><br>Normal tab · public metadata only</span></aside>
        </div>
      </article>`;
    announce(`${page.title} loaded`);
  }

  function renderLoading(target) {
    app.classList.remove("tabs-open");
    state.mode = "loading";
    $("progress").className = "loading";
    setChrome("Loading", publicUrl(target), "Loading");
    surface.innerHTML = `
      <section class="state-page fixture-page" aria-hidden="true">
        <div class="article-rule"></div><div class="article-grid"><div><div class="eyebrow">Browser</div><h1>Keeping your place</h1><p>The address and navigation controls stay available while the newest navigation intent runs.</p></div></div>
      </section>
      <div class="loading-mask" role="status"><div class="loading-card"><div class="loading-ring"></div><h2>Opening page</h2><p>${escapeHtml(publicUrl(target))}</p></div></div>`;
    announce(`Loading ${publicUrl(target)}`);
  }

  function renderRecovery(kind) {
    app.classList.remove("tabs-open");
    state.mode = kind;
    state.lastWorkspaceMode = kind;
    $("progress").className = "";
    const copy = {
      offline: ["You’re offline", "The connection could not reach this page. Check the network, then retry without retyping the address.", "Offline", "⌁"],
      "engine-error": ["This page can’t open", "The browser engine could not complete the request. Your address remains available and no page body is exposed.", "Engine error", "!"],
      timeout: ["The page took too long", "The request reached the navigation limit. Retry starts one new request and stale completions are ignored.", "Timeout", "◷"],
      "invalid-input": ["Enter a valid address or search", "Use an HTTP or HTTPS address, or enter a search phrase. Empty input does not start navigation.", "Input needed", "i"],
    }[kind];
    const target = address.value.trim() || "Address is ready to edit";
    setChrome(copy[0], publicUrl(target), copy[2]);
    surface.innerHTML = `
      <section class="state-page recovery" aria-label="${escapeHtml(copy[2])}">
        <div class="recovery-icon" aria-hidden="true">${copy[3]}</div>
        <div><div class="eyebrow">Browser recovery</div><h1>${copy[0]}</h1><p>${copy[1]}</p></div>
        <div class="home-actions">
          <button class="action-button primary" data-command="retry" data-row="1" data-col="0">Retry</button>
          <button class="action-button" data-command="recovery-back" data-row="1" data-col="1">Back</button>
          <button class="action-button" data-command="focus-address" data-row="1" data-col="2">Edit address</button>
        </div>
      </section>`;
    queueMicrotask(() => surface.querySelector('[data-command="retry"]')?.focus());
    announce(copy[0]);
  }

  function tabLabel(tab) {
    const page = currentPage(tab);
    return page ? page.title : "Start page";
  }

  function tabUrl(tab) {
    const page = currentPage(tab);
    return page ? publicUrl(page.url) : "Local start surface";
  }

  function renderTabs(focusTabId = state.selectedTabId) {
    app.classList.add("tabs-open");
    state.mode = "tabs";
    $("progress").className = "";
    setChrome("Tabs", `${state.tabs.length} normal-mode tab${state.tabs.length === 1 ? "" : "s"}`, "Manage");
    const visibleTabs = state.tabs;
    surface.innerHTML = `
      <section class="state-page tabs-view" aria-label="Tabs manager">
        <div class="tabs-heading">
          <button class="control tabs-back" data-command="close-tabs" data-row="0" data-col="0" aria-label="Return to browser">‹</button>
          <h1>Tabs</h1>
          <p>${state.tabs.length} normal · maximum 20</p>
        </div>
        <div class="tab-list">
          ${visibleTabs.map((tab, index) => `
            <article class="tab-row ${tab.id === state.selectedTabId ? "selected" : ""}">
              <div class="tab-preview" aria-hidden="true">${escapeHtml(tabLabel(tab).slice(0, 1).toUpperCase())}</div>
              <button class="tab-open" data-command="select-tab" data-tab-id="${tab.id}" data-row="${index + 1}" data-col="1" aria-label="Open ${escapeHtml(tabLabel(tab))}${tab.id === state.selectedTabId ? ", current tab" : ""}">
                <strong>${escapeHtml(tabLabel(tab))}</strong><span>${escapeHtml(tabUrl(tab))}</span>
              </button>
              <button class="control tab-close" data-command="request-close" data-tab-id="${tab.id}" data-row="${index + 1}" data-col="2" aria-label="Close ${escapeHtml(tabLabel(tab))}">×</button>
            </article>`).join("")}
        </div>
        <div class="tabs-footer">
          <button class="action-button primary" data-command="new-tab" data-row="${state.tabs.length + 1}" data-col="1" ${state.tabs.length >= 20 ? "disabled" : ""}>New tab</button>
          <span class="limit-note">${state.tabs.length >= 20 ? "Tab limit reached" : `${20 - state.tabs.length} tabs available`}</span>
        </div>
      </section>`;
    queueMicrotask(() => surface.querySelector(`[data-tab-id="${focusTabId}"][data-command="select-tab"]`)?.focus());
    announce("Tabs manager opened");
  }

  function normalizeInput(raw) {
    const value = raw.trim();
    if (!value) return null;
    if (/^https?:\/\//i.test(value)) {
      try {
        const url = new URL(value);
        return { url: url.href, title: url.hostname.replace(/^www\./, "") || "Web page" };
      } catch { return { invalid: true }; }
    }
    if (/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) return { invalid: true };
    return { url: `https://search.local/?q=${encodeURIComponent(value)}`, title: `Search: ${value.slice(0, 60)}` };
  }

  function navigate(raw, forcedOutcome = null) {
    const normalized = normalizeInput(raw);
    if (!normalized || normalized.invalid) { renderRecovery("invalid-input"); return; }
    if (state.navigationTimer) clearTimeout(state.navigationTimer);
    const intent = ++state.navigationIntent;
    renderLoading(normalized.url);
    const lower = raw.toLowerCase();
    const outcome = forcedOutcome || (lower.includes("offline") ? "offline" : lower.includes("engine-error") ? "engine-error" : lower.includes("timeout") ? "timeout" : "page");
    state.navigationTimer = setTimeout(() => {
      if (intent !== state.navigationIntent) return;
      state.navigationTimer = null;
      if (outcome !== "page") { renderRecovery(outcome); return; }
      const tab = selectedTab();
      tab.history = tab.history.slice(0, tab.historyIndex + 1);
      tab.history.push({ title: normalized.title, url: normalized.url });
      tab.historyIndex = tab.history.length - 1;
      renderPage();
    }, 620);
  }

  function historyMove(delta) {
    const tab = selectedTab();
    const next = tab.historyIndex + delta;
    if (next < -1 || next >= tab.history.length) return;
    tab.historyIndex = next;
    if (next === -1) { address.value = ""; renderHome(); } else { renderPage(); }
  }

  function openCloseDialog(tabId) {
    const tab = state.tabs.find(candidate => candidate.id === tabId);
    if (!tab) return;
    focusMemory.set("modal", document.activeElement);
    state.pendingCloseId = tabId;
    $("modal-copy").textContent = "This tab will be removed.";
    modalLayer.classList.remove("hidden");
    queueMicrotask(() => $("modal-cancel").focus());
    announce("Close tab confirmation opened");
  }

  function dismissModal(confirmClose) {
    const pending = state.pendingCloseId;
    modalLayer.classList.add("hidden");
    state.pendingCloseId = null;
    if (confirmClose && pending) {
      const index = state.tabs.findIndex(tab => tab.id === pending);
      if (index >= 0) state.tabs.splice(index, 1);
      if (!state.tabs.length) state.tabs.push(createTab(`tab-${Date.now()}`));
      if (!state.tabs.some(tab => tab.id === state.selectedTabId)) {
        state.selectedTabId = state.tabs[Math.min(index, state.tabs.length - 1)].id;
      }
      renderTabs(state.selectedTabId);
      announce("Tab closed");
      return;
    }
    const restore = focusMemory.get("modal");
    if (restore instanceof HTMLElement && restore.isConnected) restore.focus();
    announce("Close cancelled");
  }

  function newTab() {
    if (state.tabs.length >= 20) return;
    const id = `tab-${Date.now()}`;
    state.tabs.push(createTab(id));
    state.selectedTabId = id;
    address.value = "";
    renderTabs(id);
  }

  function selectTab(tabId) {
    if (!state.tabs.some(tab => tab.id === tabId)) return;
    state.selectedTabId = tabId;
    const page = currentPage();
    if (page) renderPage(page); else { address.value = ""; renderHome(); }
    queueMicrotask(() => address.focus());
  }

  function activateCommand(target) {
    const command = target.dataset.command;
    if (command === "fixture") { address.value = "https://docs.tizen.org/"; navigate(address.value); }
    else if (command === "focus-address") address.focus();
    else if (command === "retry") navigate(address.value || "https://www.tizen.org/");
    else if (command === "recovery-back") handleBack();
    else if (command === "select-tab") selectTab(target.dataset.tabId);
    else if (command === "request-close") openCloseDialog(target.dataset.tabId);
    else if (command === "new-tab") newTab();
    else if (command === "close-tabs") handleBack();
  }

  function handleBack() {
    if (!modalLayer.classList.contains("hidden")) { dismissModal(false); return; }
    if (state.mode === "tabs") {
      const page = currentPage();
      if (page) renderPage(page); else renderHome();
      queueMicrotask(() => $("tabs").focus());
      return;
    }
    if (["offline", "engine-error", "timeout", "invalid-input"].includes(state.mode)) {
      const page = currentPage();
      if (page) renderPage(page); else renderHome();
      queueMicrotask(() => address.focus());
      return;
    }
    const tab = selectedTab();
    if (tab.historyIndex > 0) { historyMove(-1); return; }
    if (tab.historyIndex === 0) { tab.historyIndex = -1; address.value = ""; renderHome(); return; }
    state.exitRequested = true;
    announce("Back would exit the installed application");
  }

  function focusablesForCurrentScope() {
    const root = modalLayer.classList.contains("hidden") ? app : modalLayer;
    return [...root.querySelectorAll('button:not([disabled]), input:not([disabled]), [tabindex="0"]')]
      .filter(element => !element.closest(".hidden") && element.getClientRects().length > 0);
  }

  function moveFocus(direction) {
    const focusables = focusablesForCurrentScope();
    if (!focusables.length) return;
    const current = document.activeElement;
    const currentRow = Number(current?.dataset?.row ?? 0);
    const currentCol = Number(current?.dataset?.col ?? 0);
    if (direction === "down" && currentRow === 0 && state.mode !== "tabs" && modalLayer.classList.contains("hidden")) {
      const bodyTargets = focusables
        .filter(element => Number(element.dataset.row ?? 0) > 0)
        .sort((a, b) => Number(a.dataset.row) - Number(b.dataset.row) || Number(a.dataset.col) - Number(b.dataset.col));
      bodyTargets[0]?.focus();
      return;
    }
    if (direction === "up" && currentRow === 1 && state.mode !== "tabs" && modalLayer.classList.contains("hidden")) {
      address.focus();
      return;
    }
    let candidates;
    if (direction === "left" || direction === "right") {
      candidates = focusables.filter(element => Number(element.dataset.row ?? 0) === currentRow);
      candidates.sort((a, b) => Number(a.dataset.col ?? 0) - Number(b.dataset.col ?? 0));
      let index = Math.max(0, candidates.indexOf(current));
      index = Math.max(0, Math.min(candidates.length - 1, index + (direction === "left" ? -1 : 1)));
      candidates[index]?.focus();
      return;
    }
    const rows = [...new Set(focusables.map(element => Number(element.dataset.row ?? 0)))].sort((a, b) => a - b);
    let rowIndex = Math.max(0, rows.indexOf(currentRow));
    rowIndex = Math.max(0, Math.min(rows.length - 1, rowIndex + (direction === "up" ? -1 : 1)));
    candidates = focusables.filter(element => Number(element.dataset.row ?? 0) === rows[rowIndex]);
    candidates.sort((a, b) => Math.abs(Number(a.dataset.col ?? 0) - currentCol) - Math.abs(Number(b.dataset.col ?? 0) - currentCol));
    candidates[0]?.focus();
  }

  function seedTabs(count) {
    const bounded = Math.max(1, Math.min(20, Number(count) || 1));
    state.tabs = Array.from({ length: bounded }, (_, index) => createTab(`fixture-${index + 1}`, {
      title: index === 0 ? "Tizen documentation" : `Reference page ${index + 1}`,
      url: `https://fixture.local/page-${index + 1}`,
    }));
    state.selectedTabId = state.tabs[0].id;
    renderTabs();
  }

  function showState(name) {
    if (state.navigationTimer) { clearTimeout(state.navigationTimer); state.navigationTimer = null; }
    state.navigationIntent += 1;
    if (name === "home") { address.value = ""; renderHome(); }
    else if (name === "page") {
      const tab = selectedTab();
      const page = { title: "Tizen documentation", url: "https://docs.tizen.org/" };
      tab.history = [page]; tab.historyIndex = 0; address.value = page.url; renderPage(page);
    } else if (name === "loading") { address.value = "https://docs.tizen.org/"; renderLoading(address.value); }
    else if (["offline", "engine-error", "timeout", "invalid-input"].includes(name)) { address.value = name === "offline" ? "https://offline.example/" : "https://example.invalid/"; renderRecovery(name); }
    else if (name === "tabs") { seedTabs(3); }
    else if (name === "max-tabs") { seedTabs(20); }
    else if (name === "modal") { seedTabs(3); queueMicrotask(() => openCloseDialog(state.selectedTabId)); }
  }

  app.addEventListener("click", event => {
    const target = event.target.closest("button,[data-command]");
    if (!target || target.disabled) return;
    if (target.id === "back") historyMove(-1);
    else if (target.id === "forward") historyMove(1);
    else if (target.id === "reload") navigate(address.value || currentPage()?.url || "https://www.tizen.org/");
    else if (target.id === "tabs") renderTabs();
    else if (target.id === "modal-cancel") dismissModal(false);
    else if (target.id === "modal-confirm") dismissModal(true);
    else activateCommand(target);
  });

  address.addEventListener("keydown", event => {
    if (event.key === "Enter") { event.preventDefault(); navigate(address.value); }
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape" || event.key === "BrowserBack") { event.preventDefault(); handleBack(); return; }
    if (!modalLayer.classList.contains("hidden") && event.key === "Tab") {
      event.preventDefault();
      moveFocus(event.shiftKey ? "left" : "right");
      return;
    }
    const directions = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" };
    if (directions[event.key]) { event.preventDefault(); moveFocus(directions[event.key]); return; }
    if (event.key === "Enter" && document.activeElement !== address) {
      const active = document.activeElement;
      if (active instanceof HTMLElement && (active.matches("button") || active.dataset.command)) {
        event.preventDefault(); active.click();
      }
    }
  });

  const query = new URLSearchParams(location.search);
  if (query.get("verify") === "1") {
    const tray = $("verification-tray");
    tray.classList.remove("hidden");
    ["home", "loading", "page", "offline", "engine-error", "timeout", "tabs", "modal", "max-tabs"].forEach(name => {
      const button = document.createElement("button");
      button.textContent = name;
      button.addEventListener("click", () => showState(name));
      tray.append(button);
    });
  }

  window.__browserPreview = {
    getState: () => ({
      mode: state.mode,
      selectedTabId: state.selectedTabId,
      tabCount: state.tabs.length,
      modalOpen: !modalLayer.classList.contains("hidden"),
      activeLabel: document.activeElement?.getAttribute("aria-label") || document.activeElement?.textContent?.trim() || "",
      disabled: { back: $("back").disabled, forward: $("forward").disabled, reload: $("reload").disabled },
      exitRequested: state.exitRequested,
    }),
    showState,
    seedTabs,
    handleBack,
    navigate,
  };

  new ResizeObserver(scaleCanvas).observe(viewport);
  addEventListener("resize", scaleCanvas);
  scaleCanvas();
  renderHome();
  address.focus();
})();
</script>
</body>
</html>
