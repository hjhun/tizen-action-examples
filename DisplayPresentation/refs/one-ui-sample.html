<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentation preview</title>
<style>
:root{font-family:"SamsungOne","Segoe UI",Arial,sans-serif;color:#1b1b20;background:#f7f7f8}*{box-sizing:border-box}body{margin:0;overflow:hidden}[hidden]{display:none!important}
#canvas{position:absolute;width:1920px;height:1080px;transform-origin:top left;background:#f7f7f8}header{position:absolute;left:132px;top:56px;color:#6f7078;font-size:24px}
#surface{position:absolute;left:132px;top:176px;width:1656px;height:660px;padding:40px 52px;background:white;border:1px solid #d8d8de;border-radius:18px;overflow:hidden}
.column{display:flex;flex-direction:column;gap:4px}.text{margin:0;flex:none;height:120px;overflow:hidden;font-size:28px;line-height:1.25;overflow-wrap:anywhere;display:flex;align-items:center;white-space:pre-wrap}.headline{font-size:44px;font-weight:600}.title{font-size:36px;font-weight:600}.label{font-size:24px;color:#6f7078}.supporting{font-size:26px;color:#6f7078}
#navigation{position:absolute;left:132px;top:884px;width:1656px;height:76px;display:flex;align-items:center;gap:24px}button{height:68px;min-width:184px;padding:0 26px;border:1px solid #d8d8de;border-radius:12px;background:white;color:#1b1b20;font-family:inherit;font-size:28px;cursor:pointer}button:focus{outline:4px solid #1466c3;outline-offset:4px;background:#e8f1fb;transform:scale(1.02)}button:disabled{opacity:.4;cursor:default}#counter{min-width:180px;font-size:26px;color:#6f7078}#dismiss{margin-left:auto}
#verification{position:fixed;right:12px;top:12px;z-index:2;display:flex;gap:8px}#verification button{font:14px Arial;height:34px;min-width:0;padding:0 10px}.error{border-color:#e9bbb6!important}.error .title{color:#b3261e}
/* LOCAL preview adaptation: 28 reference units, not NUI typography/fit evidence. */
.local-column{align-items:stretch;justify-content:flex-start}.local-column .text{font-size:28px;height:auto;min-height:120px;overflow:visible;flex-shrink:0}
</style></head><body>
<main id="canvas" aria-label="Presentation"><header>Presentation</header><section id="surface" aria-live="polite"></section><nav id="navigation" aria-label="Presentation pages"><button id="previous">Previous</button><span id="counter"></span><button id="next">Next</button><button id="local-entry" hidden>Local canonical example</button><button id="dismiss">Dismiss</button></nav></main>
<nav id="verification" hidden aria-label="Verification fixtures"></nav><script src="fixtures.js"></script><script>
'use strict';
const LIMIT=65536,MAX_NODES=512,TEXTS_PER_PAGE=4,roles=new Set(['headline','title','body','label','supporting']);
const object=v=>v!==null&&typeof v==='object'&&!Array.isArray(v),only=(v,keys)=>object(v)&&Object.keys(v).every(k=>keys.includes(k)),identifier=v=>typeof v==='string'&&/^[A-Za-z0-9:_-]{1,64}$/.test(v);
function segments(path){
  if(typeof path!=='string'||path.length<2||path.length>1024||!path.startsWith('/'))throw Error('A bounded absolute text path is required.');
  const parts=path.slice(1).split('/');
  if(parts.length>8||parts.some(p=>/~(?:[^01]|$)/.test(p)))throw Error('The text path is invalid.');
  return parts.map(p=>p.replace(/~1/g,'/').replace(/~0/g,'~'));
}
function parse(input){
  if(typeof input?.Template!=='string'||typeof input?.Document!=='string'||!input.Template.trim()||!input.Document.trim()||input.Template.length>LIMIT||input.Document.length>LIMIT)throw Error('Template and Document must be non-empty JSON values up to 64 Ki characters.');
  const t=JSON.parse(input.Template),d=JSON.parse(input.Document),s=t.surfaceUpdate,u=d.dataModelUpdate;
  if(!object(s)||!object(u)||!identifier(s.surfaceId)||s.surfaceId!==u.surfaceId||u.path!=='/'||!Array.isArray(s.components)||!object(u.value))throw Error('Matching legacy surface and data objects are required.');
  if(s.components.length>MAX_NODES)throw Error('Too many components.');
  const defs=new Map,parents=new Set;
  for(const item of s.components){
    if(!identifier(item?.id)||!object(item.component)||Object.keys(item.component).length!==1||defs.has(item.id))throw Error('A unique bounded component ID and one component type are required.');
    const [kind,v]=Object.entries(item.component)[0];
    if(kind==='Column'){
      if(!only(v,['children']))throw Error('Column styling is unsupported.');
      const children=Array.isArray(v.children)?v.children:only(v.children,['explicitList'])?v.children.explicitList:null;
      if(!Array.isArray(children)||children.length>MAX_NODES||!children.every(identifier))throw Error('Column requires explicit child IDs.');
      for(const id of children){if(parents.has(id))throw Error('A component cannot have multiple parents.');parents.add(id)}
      defs.set(item.id,{kind,id:item.id,children});
    }else if(kind==='Text'){
      if(!only(v,['text','role'])||!only(v.text,['path'])||('role'in v&&!roles.has(v.role)))throw Error('Unsupported Text property.');
      defs.set(item.id,{kind,id:item.id,segments:segments(v.text.path),role:v.role||'body'});
    }else throw Error('Unsupported component: '+kind);
  }
  for(const id of parents)if(!defs.has(id))throw Error('Unknown child component.');
  const roots=[...defs.values()].filter(n=>!parents.has(n.id));
  if(roots.length!==1||roots[0].kind!=='Column')throw Error('One Column root is required.');
  const seen=new Set;
  function build(id,depth){
    if(depth>4||seen.has(id))throw Error('Invalid component tree.');
    seen.add(id);const node=defs.get(id);
    if(node.kind==='Column')return{kind:node.kind,id,children:node.children.map(c=>build(c,depth+1))};
    let value=u.value;
    for(const part of node.segments){
      if(Array.isArray(value)&&!/^(0|[1-9][0-9]*)$/.test(part))throw Error('Invalid array index.');
      if((!object(value)&&!Array.isArray(value))||!Object.hasOwn(value,part))throw Error('Missing text binding.');
      value=value[part];
    }
    if(typeof value!=='string')throw Error('Text bindings must resolve to strings.');
    return{kind:node.kind,id,role:node.role,value:value.slice(0,256)};
  }
  const root=build(roots[0].id,1);
  if(seen.size!==defs.size)throw Error('Unreachable components are unsupported.');
  return{surfaceId:s.surfaceId,root};
}
function texts(node){return node.kind==='Text'?[node]:node.children.flatMap(texts)}
function paginate(surface){
  const pages=[];
  for(let first=0;first<Math.max(1,texts(surface.root).length);first+=TEXTS_PER_PAGE){
    let position=0;
    function slice(node){
      if(node.kind==='Text'){const i=position++;return i>=first&&i<first+TEXTS_PER_PAGE?node:null}
      const children=node.children.map(slice).filter(Boolean);
      return children.length?{...node,children}:null;
    }
    pages.push({...surface,root:slice(surface.root)||{kind:'Column',id:surface.root.id,children:[]}});
  }
  return pages;
}
const area=document.querySelector('#surface'),previous=document.querySelector('#previous'),next=document.querySelector('#next'),dismiss=document.querySelector('#dismiss'),counter=document.querySelector('#counter');
const localEntry=document.querySelector('#local-entry'),heading=document.querySelector('header');
let pages=[],page=0,failure='',local=null,localSequence=0;
const localStateButtons=[];
// Preview-only LOCAL capture, not the C# registry, a provider or canonical input parser.
// Created only by the visible idle entry button. No user data or persistence.
function enterLocal(){
  if(local||pages.length||failure)return;
  const data={sample:{message:'Resolved local text'}};
  local={sequence:++localSequence,state:'ready',capture:Object.freeze([
    Object.freeze({sourceId:'literal',value:'Local canonical example'}),
    Object.freeze({sourceId:'bound',bindingPath:'/sample/message',value:data.sample.message})
  ])};render('dismiss');
}
function localState(state){if(local){local.state=state;render('dismiss')}}
function exitLocal(){local=null;render('local-entry')}

function renderNode(node,parent){
  const element=document.createElement(node.kind==='Text'?'p':'div');element.dataset.componentId=node.id;
  if(node.kind==='Text'){element.className='text '+node.role;element.textContent=node.value}
  else{element.className='column';node.children.forEach(child=>renderNode(child,element))}
  parent.append(element);
}
function render(prefer='next'){
  area.replaceChildren();area.classList.toggle('error',Boolean(failure)||local?.state==='failure');
  heading.textContent=local?'Internal verification example — not producer input':'Presentation';
  localEntry.hidden=Boolean(local||pages.length||failure);
  localStateButtons.forEach(button=>button.disabled=!local);
  if(local){
    if(local.state==='ready'){
      const column=document.createElement('div');column.className='column local-column';column.dataset.sourceId='root';
      local.capture.forEach((text,index)=>{const label=document.createElement('p');label.className='text';label.textContent=text.value;label.dataset.occurrence=String(index);column.append(label)});
      area.append(column);
    }else{
      renderNode({kind:'Text',id:'local-status',role:'body',value:local.state==='waiting'?'Waiting for the local example.':'The local example cannot be displayed.'},area);
      renderNode({kind:'Text',id:'local-note',role:'supporting',value:'Preview state only. Dismiss or Back returns to idle.'},area);
    }
    previous.hidden=next.hidden=counter.hidden=true;previous.disabled=next.disabled=true;counter.textContent='';dismiss.focus();return;
  }
  if(failure){renderNode({kind:'Text',id:'error-title',role:'title',value:'This presentation cannot be shown'},area);renderNode({kind:'Text',id:'error-message',role:'body',value:failure},area)}
  else if(pages.length&&texts(pages[page].root).length)renderNode(pages[page].root,area);
  else renderNode({kind:'Text',id:'empty',role:'body',value:pages.length?'No items':'No presentation is currently available.'},area);
  previous.disabled=page===0||!pages.length;next.disabled=page>=pages.length-1;
  previous.hidden=next.hidden=counter.hidden=pages.length<=1;counter.textContent=pages.length?(page+1)+' / '+pages.length:'';
  const target=prefer==='local-entry'&&!localEntry.hidden?localEntry:prefer==='previous'&&!previous.disabled?previous:!next.disabled?next:!previous.disabled?previous:dismiss;target.focus();
}
// JS event order models legacy priority; it does not prove native check/commit atomicity.
function show(input){local=null;try{pages=paginate(parse(input));failure=''}catch(e){pages=[];failure=e.message}page=0;render()}
function move(delta){const changed=Math.max(0,Math.min(pages.length-1,page+delta));if(changed!==page){page=changed;render(delta<0?'previous':'next')}}
previous.onclick=()=>move(-1);next.onclick=()=>move(1);dismiss.onclick=()=>{if(local){exitLocal();return}pages=[];failure='';page=0;render('dismiss')};localEntry.onclick=enterLocal;
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'||event.key==='BrowserBack'){event.preventDefault();dismiss.click();return}
  if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(event.key)){
    event.preventDefault();const buttons=[previous,next,localEntry,dismiss].filter(b=>!b.hidden&&!b.disabled),index=buttons.indexOf(document.activeElement),delta=['ArrowDown','ArrowRight'].includes(event.key)?1:-1;
    buttons[(index+delta+buttons.length)%buttons.length]?.focus();
  }
});
function resize(){const scale=Math.min(innerWidth/1920,innerHeight/1080),canvas=document.querySelector('#canvas');canvas.style.transform='scale('+scale+')';canvas.style.left=(innerWidth-1920*scale)/2+'px';canvas.style.top=(innerHeight-1080*scale)/2+'px'}
addEventListener('resize',resize);resize();
const fixtures=window.presentationFixtures||{},verification=document.querySelector('#verification');
if(new URLSearchParams(location.search).has('verify')){
  verification.hidden=false;
  for(const [name,input]of Object.entries({...fixtures,malformed:{Template:'{',Document:'{}'},unsupported:{Template:fixtures.calendar1?.Template.replaceAll('"Text"','"Image"'),Document:fixtures.calendar1?.Document}})){
    const button=document.createElement('button');button.textContent=name;button.onclick=()=>show(input);verification.append(button);
  }
}
if(!verification.hidden){
  // Extend the existing ?verify fixture toolbar; never creates a local session.
  for(const state of ['waiting','failure','ready']){
    const button=document.createElement('button');button.textContent='Local '+state;
    button.onclick=()=>localState(state);localStateButtons.push(button);verification.append(button);
  }
}
window.preview={parse,paginate,show,move,get local(){return local?{sequence:local.sequence,state:local.state}:null},get current(){return pages[page]||null},get page(){return page},get count(){return pages.length}};show(fixtures.calendar1);
</script></body></html>
