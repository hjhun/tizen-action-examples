<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendar · interactive NUI preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fb;color:#292b2f;font-family:Arial,sans-serif;overflow:hidden}#canvas{position:absolute;width:1920px;height:1080px;transform-origin:0 0}button,input,textarea{font:inherit;color:inherit;border:0}button{cursor:pointer;background:#f6f7f9;border-radius:14px;font-size:28px;padding:8px 14px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid #202329;outline-offset:1px}button.selected{background:#e4edff}button:disabled{cursor:default}h1,h2,p{margin:0;font-weight:400}.bar{position:absolute;left:64px;top:44px;width:1792px;height:82px;background:#f0f2f6;border-radius:20px;display:flex;align-items:center;gap:10px;padding:12px 18px}.period{width:330px;font-size:40px;margin:0 10px;white-space:nowrap}.bar button{height:58px}.grid{position:absolute;left:64px;top:144px;width:1204px;height:836px;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:42px repeat(6,1fr);gap:8px}.weekday{font-size:25px;color:#696d77;text-align:center;padding-top:10px}.date{display:flex;flex-direction:column;justify-content:flex-start;padding:8px;background:#f6f7f9;border-radius:12px;text-align:left;font-size:36px;align-self:stretch;overflow:hidden}.date.other{opacity:.45}.sun{color:#f13d38}.date>span{display:block}.date.today>span:first-child{background:#30343a;color:white;border-radius:9px;width:max-content;padding:0 6px}.event-chip{display:block;font-size:24px;background:#ffd599;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#292b2f;margin-top:6px;padding:0 6px}.side{position:absolute;left:1290px;top:144px;width:566px;height:836px;background:#f0f2f6;border-radius:22px;padding:20px 30px}.day-heading{font-size:74px;line-height:1.1}.day-heading small{font-size:32px;margin-left:38px}.month-label{font-size:28px;color:#696d77;margin:14px 4px 20px}.event-card{display:block;width:100%;background:#ffd599;text-align:left;margin:12px 0;font-size:36px;padding:14px 20px;border-radius:18px}.event-card small{display:block;color:#696d77;font-size:26px}.empty{background:#f6f7f9;padding:26px;text-align:center;border-radius:20px;font-size:40px}.empty p{font-size:26px;color:#696d77;margin-top:10px}.side-actions{position:absolute;left:30px;right:30px;bottom:24px;display:grid;gap:14px}.period-body{position:absolute;left:64px;top:144px;width:1792px;height:836px;display:flex;gap:12px}.week-day{flex:1;min-width:0;background:#f0f2f6;border-radius:16px;padding:20px 12px;text-align:center;font-size:30px}.week-day .event-card{font-size:25px}.day-body{background:#f0f2f6;border-radius:20px;padding:36px;display:block}.day-body h2{font-size:52px;margin-bottom:38px}.day-body .event-card{max-width:100%}.agenda{display:block;background:#f0f2f6;border-radius:20px;padding:30px}.agenda h2{font-size:34px;margin-bottom:10px}.overlay{position:absolute;inset:0;background:#00000010}.pane{position:absolute;left:1096px;top:44px;width:760px;height:936px;background:#f0f2f6;padding:28px 48px}.pane .close{margin-left:-12px}.pane button{background:#ff6b00;color:white;border-radius:12px}.pane h1{font-size:64px;margin:32px 0 22px}.pane h2{font-size:36px;margin:26px 0}.pane label{display:block;font-size:26px;color:#696d77;margin-top:18px}.pane input,.pane textarea{display:block;width:100%;background:white;font-size:30px;padding:8px 4px;min-height:62px}.pane textarea{height:120px;resize:none}.row{display:flex;gap:18px}.row>*{min-width:0;flex:1}.pane.editor label{font-size:20px;margin-top:8px}.pane.editor input{min-height:56px}.pane.editor textarea{height:96px}.pane.editor h1{margin-bottom:16px}.pane.editor .checks{margin:12px 0}.pane .actions{position:absolute;bottom:74px;right:62px;display:flex;gap:20px}.pane .actions button{width:168px;height:66px}.readout{font-size:30px;background:#f6f7f9;border-radius:14px;padding:18px;margin-top:6px}.error{color:#ad280f;font-size:26px;margin-top:18px;white-space:normal}.results{margin-top:20px}.results button{width:100%;margin-bottom:8px;font-size:26px}.checks{display:flex;gap:16px;margin:18px 0}.checks button{font-size:24px}.checks button[aria-pressed="true"]{background:#a64000}
</style>
<div id="canvas" aria-label="Calendar preview"></div>
<script>
'use strict';
const canvas=document.querySelector('#canvas'),today=new Date(2026,8,6),key='calendar-nui-preview-v1';
let date=new Date(today),month=new Date(2026,8,1),mode='Month',surface=null,selected=null,query='',matches=null;
let events=JSON.parse(localStorage.getItem(key)||'null')||[{id:'preview-review',title:'Design review',date:'2026-09-06',start:'16:00',end:'17:00',location:'Studio',note:'Review the multi-resolution layout'}];
let reminders=[];
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmt=(d,opt)=>d.toLocaleDateString('en-US',opt),save=()=>localStorage.setItem(key,JSON.stringify(events));
function el(tag,cls,text,parent){const v=document.createElement(tag);if(cls)v.className=cls;if(text!==undefined)v.textContent=text;if(parent)parent.append(v);return v}
function button(text,parent,fn,cls=''){const b=el('button',cls,text,parent);b.onclick=fn;return b}
function open(name,id=null){surface=name;selected=id;render()}
function items(d){return events.filter(e=>e.date===iso(d)).sort((a,b)=>a.start.localeCompare(b.start))}
function card(e,parent){const b=button('',parent,()=>open('detail',e.id),'event-card');el('small','',e.start,b);el('span','',e.title,b);el('small','',e.location,b);return b}
function render(){
 canvas.replaceChildren();const main=el('main','',undefined,canvas);main.inert=!!surface;
 const bar=el('nav','bar',undefined,main);
 button('Prev',bar,()=>move(-1));button('Today',bar,()=>{date=new Date(today);month=new Date(2026,8,1);render()});button('Next',bar,()=>move(1));
 const title=mode==='Day'?fmt(date,{month:'short',day:'numeric',year:'numeric'}):fmt(month,{month:mode==='Month'?'long':'short',year:'numeric'})+(mode==='Agenda'?' agenda':'');
 el('span','period',title,bar);
 for(const m of ['Month','Week','Day','Agenda'])button(m,bar,()=>{mode=m;render()},mode===m?'selected':'');
 button('Search',bar,()=>open('search'));
 if(mode==='Month')renderMonth(main);else renderPeriod(main);
 if(surface)renderOverlay();scale();
}
function move(n){if(mode==='Day')date.setDate(date.getDate()+n);else if(mode==='Week')date.setDate(date.getDate()+7*n);else{month.setMonth(month.getMonth()+n);date=new Date(month)}render()}
function renderMonth(main){
 const grid=el('section','grid',undefined,main);
 for(const name of ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'])el('div','weekday'+(name==='Sunday'?' sun':''),name,grid);
 const first=new Date(month);first.setDate(1-first.getDay());
 for(let i=0;i<42;i++){const d=new Date(first);d.setDate(first.getDate()+i);const b=button('',grid,()=>{date=d;render()},'date'+(d.getMonth()!==month.getMonth()?' other':'')+(iso(d)===iso(today)?' today':'')+(iso(d)===iso(date)?' selected':'')+(d.getDay()===0?' sun':''));b.setAttribute('aria-label',fmt(d,{weekday:'long',month:'long',day:'numeric'}));el('span','',d.getDate(),b);for(const e of items(d).slice(0,3))el('span','event-chip',e.title,b)}
 const side=el('section','side',undefined,main),h=el('div','day-heading',date.getDate(),side);el('small','',fmt(date,{weekday:'short'}).toUpperCase(),h);el('p','month-label',fmt(date,{month:'long',year:'numeric'}),side);
 if(items(date).length)items(date).slice(0,4).forEach(e=>card(e,side));else{const empty=el('div','empty','No events',side);el('p','','Press Back to return to the month',empty)}
 const actions=el('div','side-actions',undefined,side);button('Add event   +',actions,()=>open('new'));button('Reminders   ›',actions,()=>open('reminders'));
}
function renderPeriod(main){
 const body=el('section','period-body'+(mode==='Day'?' day-body':mode==='Agenda'?' agenda':''),undefined,main);
 if(mode==='Week'){const first=new Date(date);first.setDate(first.getDate()-first.getDay());for(let i=0;i<7;i++){const d=new Date(first);d.setDate(first.getDate()+i);const col=el('section','week-day',fmt(d,{weekday:'short',month:'short',day:'numeric'}),body);items(d).slice(0,4).forEach(e=>card(e,col))}}
 else if(mode==='Day'){el('h2','',fmt(date,{weekday:'long',month:'long',day:'numeric'}),body);if(items(date).length)items(date).forEach(e=>card(e,body));else el('div','empty','No events today',body)}
 else {const list=events.filter(e=>e.date.startsWith(iso(month).slice(0,7)));if(!list.length)el('div','empty','No events in this period',body);for(const e of list){el('h2','',e.date,body);card(e,body)}}
}
function field(parent,label,value='',tag='input'){const holder=parent.classList.contains('row')?el('div','',undefined,parent):parent;el('label','',label,holder);const i=el(tag,'',undefined,holder);i.value=value;i.setAttribute('aria-label',label);return i}
function renderOverlay(){
 const overlay=el('div','overlay',undefined,canvas),pane=el('section','pane',undefined,overlay);pane.setAttribute('role','dialog');pane.setAttribute('aria-modal','true');button('Close',pane,()=>open(null),'close');
 const item=events.find(e=>e.id===selected);
 if(surface==='detail'&&item){el('h1','',item.title,pane);for(const [label,value] of [['When',`${item.date}  ${item.start} – ${item.end}`],['Location',item.location],['Note',item.note]]){el('label','',label,pane);el('p','readout',value||'—',pane)}const a=el('div','actions',undefined,pane);button('Edit',a,()=>open('edit',item.id));button('Delete',a,()=>open('delete',item.id))}
 else if(surface==='delete'&&item){el('h1','','Delete event?',pane);el('p','readout',item.title,pane);el('p','error','This event and its linked reminders will be removed.',pane);const a=el('div','actions',undefined,pane);button('Cancel',a,()=>open('detail',item.id));button('Delete',a,()=>{events=events.filter(e=>e.id!==item.id);save();open(null)})}
 else if(surface==='new'||surface==='edit'){
  pane.classList.add('editor');
  el('h1','',surface==='new'?'Add event':'Edit event',pane);const title=field(pane,'Title',item?.title||''),row=el('div','row',undefined,pane),day=field(row,'YYYY-MM-DD',item?.date||iso(date)),start=field(row,'Start HH:mm',item?.start||'10:00'),end=field(row,'End HH:mm',item?.end||'11:00'),location=field(pane,'Location (optional)',item?.location||''),note=field(pane,'Note (optional)',item?.note||'','textarea');el('label','','Reminder',pane);const checks=el('div','checks',undefined,pane);for(const text of ['10 min','30 min','1 hour','1 day']){const b=button(text,checks,()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true'));b.setAttribute('aria-pressed','false')}const error=el('p','error','',pane),a=el('div','actions',undefined,pane);button('Cancel',a,()=>open(item?'detail':null,item?.id));button('Save',a,()=>{if(!title.value.trim()||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(day.value)||start.value>=end.value){error.textContent='Enter a title and an end time after the start.';return}const e={id:item?.id||crypto.randomUUID(),title:title.value.trim(),date:day.value,start:start.value,end:end.value,location:location.value,note:note.value};events=events.filter(x=>x.id!==e.id).concat(e);save();open('detail',e.id)})
 }
 else if(surface==='search'){el('h1','','Advanced search',pane);const q=field(pane,'Title, location, or note',query),row=el('div','row',undefined,pane),from=field(row,'Start date (inclusive)',iso(month)),next=new Date(month.getFullYear(),month.getMonth()+1,1),to=field(row,'End date (exclusive)',iso(next)),checks=el('div','checks',undefined,pane),enabled=new Set(['title','location','note']);for(const [name,label]of [['title','Title'],['location','Location'],['note','Notes']]){const b=button(label+' ✓',checks,()=>{enabled.has(name)?enabled.delete(name):enabled.add(name);b.setAttribute('aria-pressed',enabled.has(name))});b.setAttribute('aria-pressed','true')}const result=el('div','results',undefined,pane);const apply=()=>{query=q.value;result.replaceChildren();const list=events.filter(e=>e.date>=from.value&&e.date<to.value&&[...enabled].some(k=>e[k].toLowerCase().includes(query.toLowerCase())));if(!list.length)el('p','error','No events match these filters.',result);list.forEach(e=>button(`${e.date}  ${e.start}  ${e.title}`,result,()=>open('detail',e.id)))};const b=button('Search',pane,apply);b.style.cssText='display:block;margin:28px 0 0 auto';pane.append(result)}
 else if(surface==='reminders'){el('h1','','Reminders',pane);button('Add reminder',pane,()=>open('new-reminder'));for(const r of reminders)button((r.done?'✓ ':'○ ')+r.title,pane,()=>{r.done=!r.done;render()});if(!reminders.length)el('p','readout','No reminders yet',pane)}
 else if(surface==='new-reminder'){el('h1','','New reminder',pane);const title=field(pane,'Title'),due=field(pane,'Due date and time','2026-09-06T18:00'),note=field(pane,'Note (optional)','','textarea');button('Save',pane,()=>{if(title.value.trim()){reminders.push({title:title.value,due:due.value,note:note.value,done:false});open('reminders')}})}
 const focus=pane.querySelector('button');focus?.focus();
}
function scale(){const s=Math.min(innerWidth/1920,innerHeight/1080);canvas.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`}
addEventListener('resize',scale);addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();open(null);return}if(surface&&e.key==='Tab'){const f=[...document.querySelectorAll('.pane button,.pane input,.pane textarea')];const i=f.indexOf(document.activeElement);if((e.shiftKey&&i===0)||(!e.shiftKey&&i===f.length-1)){e.preventDefault();f[e.shiftKey?f.length-1:0].focus()}}if(!surface&&document.activeElement.tagName==='BUTTON'&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const f=[...mainButtons()],i=f.indexOf(document.activeElement),n=e.key==='ArrowLeft'?-1:e.key==='ArrowUp'?-7:e.key==='ArrowDown'?7:1;f[Math.max(0,Math.min(f.length-1,i+n))]?.focus()}});function mainButtons(){return canvas.querySelectorAll('main button')}
render();
</script></html>
